# Local development services for Phase 1 (README Section 2.2 / Section 17).
# Not used in Phase 0, which runs entirely standalone on the webcam.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gate_app
      POSTGRES_PASSWORD: gate_app_dev_password
      POSTGRES_DB: gate_access
    ports:
      # Host port 5433, not the default 5432 - this machine already runs a
      # separate, unrelated PostgreSQL server on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate_app -d gate_access"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380, not the default 6379 - this machine already runs an
      # unrelated Redis container on 6379 for a different project.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
